    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 3px solid #27AE60; color: #27AE60; font-weight: 700; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { 
            border: 3px solid #f3f3f3; border-top: 3px solid #27AE60; 
            border-radius: 50%; width: 20px; height: 20px; 
            animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-checkbox input:checked + div { background-color: #27AE60; border-color: #27AE60; color: white; }
        .toast-enter { animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .toast-leave { animation: slideOutRight 0.4s ease-in forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        .hero-bg { 
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.95), rgba(41, 128, 185, 0.95)), 
                        url('https://images.unsplash.com/photo-1596484552834-6a58f850d0f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover; 
        }
    </style>
</head>
<body class="bg-light text-slate-800 min-h-screen flex flex-col relative overflow-x-hidden">

    <main class="flex-grow flex flex-col items-center w-full">

                            <div class="grid grid-cols-2 gap-2">

            <!-- 個人中心與儀表板 HTML (簡化保留基本結構) -->
            <div id="view-rewards" class="hidden fade-in">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-functions.js";

        // 使用您提供的真實 Config
        const firebaseConfig = {
            apiKey: "AIzaSyBFlXwGj14KC5GMY-XhwaQxRbOeCaPr7GY",
            authDomain: "sanying-e8ba1.firebaseapp.com",
            projectId: "sanying-e8ba1",
            storageBucket: "sanying-e8ba1.firebasestorage.app",
            messagingSenderId: "833697195100",
            appId: "1:833697195100:web:a60b9bc21990afeeffb299",
            measurementId: "G-K9RQ721F79"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app, "asia-east1"); // 確保呼叫亞洲區

        window.isLoggedIn = false;
        window.currentRole = 'user';
        window.feedbacks = [];
        window.chartInstances = {};

        // === 工具函式 ===
        const showToast = (message, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const borderColor = type === 'success' ? 'border-emerald-200' : 'border-rose-200';
            const iconColor = type === 'success' ? 'text-emerald-500' : 'text-rose-500';
            toast.className = `bg-white px-4 py-3 rounded-xl shadow-lg border ${borderColor} text-sm font-bold text-slate-700 flex items-center gap-3 toast-enter pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid fa-circle-exclamation ${iconColor}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { 
                toast.classList.replace('toast-enter', 'toast-leave'); 
                setTimeout(() => toast.remove(), 400); 
            }, 4000);
        };

        // === 圖片處理 ===
        window.togglePhotoInput = (show) => {
            const fileInput = document.getElementById('photoInput');
            const preview = document.getElementById('photoPreview');
            if (show) {
                fileInput.classList.remove('hidden'); fileInput.required = true;
            } else {
                fileInput.classList.add('hidden'); fileInput.required = false; fileInput.value = '';
                preview.classList.add('hidden'); preview.src = '';
            }
        };

        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const preview = document.getElementById('photoPreview');
                    preview.src = evt.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxSize = 800;
                        let width = img.width, height = img.height;
                        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; } 
                        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        };

        // === 登入狀態監聽 ===
        onAuthStateChanged(auth, user => {
            window.isLoggedIn = !!user;
            const btn = document.getElementById('authBtn');
            const overlay = document.getElementById('formOverlay');
            const warning = document.getElementById('authWarning');
            
            if (user) {
                btn.className = "bg-slate-100 text-slate-700 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-slate-200 transition shadow-sm flex items-center gap-2";
                btn.innerHTML = `<i class="fa-solid fa-user-shield text-primary"></i> <span id="authText">已驗證</span>`;
                if(overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
                if(warning) warning.classList.add('hidden');
            } else {
                btn.className = "bg-primary text-white px-4 py-1.5 rounded-full text-sm font-medium hover:bg-emerald-700 transition shadow-sm flex items-center gap-2";
                btn.innerHTML = `<i class="fa-brands fa-google"></i> <span id="authText">實名登入</span>`;
                if(overlay) overlay.classList.remove('opacity-0', 'pointer-events-none');
                if(warning) warning.classList.remove('hidden');
            }
        });

        window.toggleAuth = () => {
            if (window.isLoggedIn) {
                signOut(auth).then(() => showToast('已登出。'));
            } else {
                signInWithPopup(auth, new GoogleAuthProvider()).catch(err => console.error(err));
            }
        };

        // === 介面切換 ===
        window.switchRole = (role) => {
            window.currentRole = role;
            const nav = document.getElementById('navTabs');
            if(role === 'user') {
                nav.innerHTML = `
                    <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 py-3 text-center tab-active transition"><i class="fa-solid fa-comments mb-1 block text-lg"></i><span class="text-xs">交流佈告欄</span></button>
                    <button onclick="switchTab('submit')" id="tab-submit" class="flex-1 py-3 text-center tab-inactive transition"><i class="fa-solid fa-pen-to-square mb-1 block text-lg"></i><span class="text-xs">我要發聲</span></button>
                    <button onclick="switchTab('rewards')" id="tab-rewards" class="flex-1 py-3 text-center tab-inactive transition"><i class="fa-solid fa-medal mb-1 block text-lg"></i><span class="text-xs">個人中心</span></button>
                `;
            } else {
                nav.innerHTML = `
                    <button onclick="switchTab('feed')" id="tab-feed" class="flex-1 py-3 text-center tab-active transition"><i class="fa-solid fa-comments mb-1 block text-lg"></i><span class="text-xs">佈告欄 (檢視)</span></button>
                    <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-3 text-center tab-inactive transition"><i class="fa-solid fa-chart-pie mb-1 block text-lg"></i><span class="text-xs">數據儀表板</span></button>
                `;
                setTimeout(initCharts, 200);
            }
            switchTab('feed');
        };

        window.switchTab = (tabId) => {
            ['feed', 'submit', 'rewards', 'dashboard'].forEach(id => {
                const view = document.getElementById(`view-${id}`);
                const btn = document.getElementById(`tab-${id}`);
                if(view) view.classList.add('hidden');
                if(btn) { btn.classList.remove('tab-active'); btn.classList.add('tab-inactive'); }
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
            document.getElementById(`tab-${tabId}`).classList.remove('tab-inactive');
        };

        // === 資料讀取與渲染 ===
        const loadData = () => {
            const q = query(collection(db, "feedbacks"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                window.feedbacks = [];
                snapshot.forEach(doc => window.feedbacks.push({ id: doc.id, ...doc.data() }));
                renderFeed();
                if(window.currentRole === 'admin') initCharts();
            });
        };

        const renderFeed = () => {
            const container = document.getElementById('feedContainer'); 
            if(!container) return;
            container.innerHTML = window.feedbacks.length === 0 ? '<div class="text-center text-slate-500 py-4 text-sm">目前尚無動態。</div>' : '';
            
            window.feedbacks.forEach((item, index) => {
                const colors = ['bg-indigo-500', 'bg-emerald-500', 'bg-amber-500', 'bg-rose-500', 'bg-cyan-500'];
                const avatarColor = colors[index % 5];
                const transports = Array.isArray(item.transports) ? item.transports : [];
                const tags = transports.map(t => `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">${t}</span>`).join('');
                const imgHtml = item.photo ? `<img src="${item.photo}" class="mt-2 rounded-lg max-h-32 object-cover border border-slate-200 w-full">` : '';
                
                container.insertAdjacentHTML('beforeend', `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="${avatarColor} text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shadow-sm">${item.avatar || 'U'}</div>
                            <div>
                                <div class="text-sm font-bold text-dark flex items-center gap-1">匿名市民 <i class="fa-solid fa-circle-check text-blue-500 text-[10px]"></i></div>
                                <div class="text-xs text-slate-500">${item.time} · ${item.station || '未知'}</div>
                            </div>
                        </div>
                        <div class="flex gap-1 flex-wrap mb-2">${tags}</div>
                        <p class="text-sm text-slate-700 mb-2 leading-relaxed">${item.content}</p>
                        ${imgHtml}
                        <div class="mt-3 flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <span class="bg-blue-50 text-secondary border border-blue-100 px-2 py-0.5 rounded text-[10px] font-bold">
                                <i class="fa-solid fa-robot"></i> ${item.ai_category || '處理中'}
                            </span>
                            <span class="text-xs font-bold text-slate-600">${item.ai_sentiment || ''}</span>
                        </div>
                    </div>
                `);
            });
        };

        // === 表單提交與 AI 呼叫 ===
        window.handleFeedbackSubmit = async (e) => {
            e.preventDefault();
            if (!window.isLoggedIn) return showToast('請先登入！', 'error');

            const btn = document.getElementById('submitBtn');
            const aiZone = document.getElementById('aiProcessZone');
            
            const transports = Array.from(document.querySelectorAll('input[name="transport"]:checked')).map(cb => cb.value);
            if (transports.length === 0) return showToast('請至少選擇一項運具！', 'error');

            btn.disabled = true; btn.classList.add('opacity-50'); 
            aiZone.classList.remove('hidden');

            let photoBase64 = null;
            const photoInput = document.getElementById('photoInput');
            if (document.querySelector('input[name="hasPhoto"]:checked').value === 'yes' && photoInput.files[0]) {
                photoBase64 = await compressImage(photoInput.files[0]);
            }

            const payload = {
                station: document.getElementById('station').value,
                timePeriod: document.getElementById('timePeriod').value,
                weather: document.getElementById('weather').value,
                transports: transports,
                content: document.getElementById('content').value,
                photo: photoBase64,
                time: new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'}),
                timestamp: Date.now(),
                avatar: auth.currentUser.displayName.charAt(0) || "U"
            };

            try {
                // UI 假進度條
                document.getElementById('ai-step-1').classList.remove('opacity-0');
                setTimeout(() => document.getElementById('ai-step-2').classList.remove('opacity-0'), 800);

                // 呼叫雲端函式
                const analyzeFeedback = httpsCallable(functions, 'analyzeFeedback');
                const result = await analyzeFeedback({ content: payload.content });
                
                document.getElementById('ai-step-3').classList.remove('opacity-0');

                // 寫入資料庫
                payload.ai_category = result.data.ai_category || "其他建議";
                payload.ai_sentiment = result.data.ai_sentiment || "neutral";
                
                await addDoc(collection(db, "feedbacks"), payload);
                
                document.getElementById('feedbackForm').reset();
                togglePhotoInput(false);
                showToast('發布成功！獲得碳吉。');
                switchTab('feed');

            } catch (error) {
                console.error("AI 呼叫失敗:", error);
                // 顯示具體錯誤，幫助除錯
                showToast(`AI 分析失敗 (${error.message})，請檢查 Console。`, 'error');
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-50'); 
                aiZone.classList.add('hidden');
                ['ai-step-1', 'ai-step-2', 'ai-step-3'].forEach(id => document.getElementById(id).classList.add('opacity-0'));
            }
        };

        // === 圖表初始化 ===
        const initCharts = () => {
            const ctx = document.getElementById('stationChart');
            if(!ctx) return;
            
            const counts = {};
            window.feedbacks.forEach(f => {
                const st = f.station || '未知';
                counts[st] = (counts[st] || 0) + 1;
            });
            const labels = Object.keys(counts);
            const data = Object.values(counts);

            if(window.chartInstances.station) window.chartInstances.station.destroy();
            window.chartInstances.station = new Chart(ctx.getContext('2d'), { 
                type: 'bar', 
                data: { labels: labels, datasets: [{ data: data, backgroundColor: '#2980B9', borderRadius: 4 }] }, 
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } 
            });
        };

        // 啟動
        document.addEventListener('DOMContentLoaded', () => { 
            window.switchRole('user'); 
            loadData();
        });
    </script>
</body>
</html>
